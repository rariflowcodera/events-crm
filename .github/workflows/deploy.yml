name: Deploy to Production

on:
  push:
    branches: [ "prod" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Install pnpm FIRST (required for setup-node caching)
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          # Build-time variables (values don't need to be real prod secrets, just present)
          BETTER_AUTH_SECRET: "build-time-secret-placeholder"
          BETTER_AUTH_URL: "http://localhost:3000"
          AWS_REGION: "me-south-1"
          AWS_ACCESS_KEY_ID: "build-placeholder"
          AWS_SECRET_ACCESS_KEY: "build-placeholder"


      - name: Prepare deployment artifacts
        run: |
          mkdir deploy_package
          # Remove cache to speed up upload
          rm -rf .next/cache
          
          # Copy essential files + LOCKFILE + TSCONFIG
          cp -r .next public package.json pnpm-lock.yaml tsconfig.json next.config.ts ecosystem.config.js deploy_package/
          
          # We DO NOT copy node_modules to save upload time. 
          # We will install them on the server.

      - name: Deploy to Server via rsync
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: "-rlgoDzvc -i --delete"
          SOURCE: "deploy_package/"
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_USER: ${{ secrets.SSH_USER }}
          REMOTE_PORT: ${{ secrets.SSH_PORT }}
          TARGET: "/home/jelastic/ROOT/" 
          SCRIPT_AFTER: |
            cd /home/jelastic/ROOT
            echo "Creating logs directory..."
            mkdir -p logs
            
            echo "Installing ALL dependencies (needed for tsx/worker)..."
            pnpm install --frozen-lockfile
            
            echo "Restarting application..."
            pm2 restart ecosystem.config.js || pm2 start ecosystem.config.js
            echo "Deployment Complete!"
