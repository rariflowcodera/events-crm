name: Deploy to Production

on:
  push:
    branches: [ "prod" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Install pnpm FIRST (required for setup-node caching)
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Prepare deployment artifacts
        run: |
          mkdir deploy_package
          cp -r .next public package.json next.config.ts ecosystem.config.js deploy_package/
          # We copy node_modules so the server doesn't need to reinstall/build anything
          cp -r node_modules deploy_package/

      - name: Deploy to Server via rsync
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: "-rlgoDzvc -i --delete"
          SOURCE: "deploy_package/"
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_USER: ${{ secrets.SSH_USER }}
          REMOTE_PORT: ${{ secrets.SSH_PORT }}
          # IMPORTANT: We deploy to your home directory, NOT the /var/www/... path
          TARGET: "/home/jelastic/ROOT/" 
          SCRIPT_AFTER: |
            cd /home/jelastic/ROOT
            # Restart App
            pm2 restart ecosystem.config.js || pm2 start ecosystem.config.js
            echo "Deployment Complete!"
